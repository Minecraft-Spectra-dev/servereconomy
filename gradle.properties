# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=cn.choosec.economy

# Dependencies
fabric_api_version=0.157.0+26.2

# SQLite JDBC version (matches the driver already bundled on the server)
sqlite_version=3.51.0.0

# MySQL JDBC driver version (bundled into the mod jar for the optional mysql backend)
mysql_version=9.2.0
